name: Build APK

on:
  push:
    branches:
      - main
      - redesign/home-polish-stable551
      - redesign/after-stable-567
      - fixes/after-stable-593
      - fixes/after-stable-598
      - fixes/after-stable-603
      - fixes/after-stable-605
      - test/automated-quality-gates
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run automated unit tests and Android Lint
        run: gradle testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build release APK
        run: gradle assembleRelease --rerun-tasks

      - name: Verify APK signature, manifest, and archive integrity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR"
          BUILD_TOOLS="$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          echo "APK size:"
          ls -lh "$APK"

          echo "Verifying APK signature:"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          echo "Checking APK archive integrity:"
          unzip -t "$APK"

          echo "Checking application ID and minimum SDK:"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -Fq "package: name='com.aldiandrew.neobrutallauncher'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          cat apk-badging.txt

      - name: Upload installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoBrutalauncher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
